<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Prototipo UPVE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="registro.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-sm border-0" style="width: 400px; border-radius: 15px;">
            <h2 class="text-center mb-4 fw-bold">Registrarse</h2>
            <div id="message" class="auth-message mb-3 d-none"></div>
            <form id="formRegistro">
                <div class="mb-3">
                    <input type="text" id="name" class="form-control custom-input" placeholder="Usuario" required>
                </div>
                <div class="mb-3">
                    <input type="email" id="email" class="form-control custom-input" placeholder="Correo electrónico" required>
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control custom-input" placeholder="Contraseña" minlength="8" required>
                    <div class="form-text">La contraseña debe tener al menos 8 caracteres.</div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Registrarse</button>
            </form>
            
            <div class="mt-3 text-center">
                <a href="login.html" class="text-decoration-none small">¿Ya tienes cuenta? Iniciar sesión</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue

            // Recolectamos los datos de los inputs
            const passwordValue = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            const showMessage = (text, type) => {
                messageEl.textContent = text;
                messageEl.className = `auth-message mb-3 alert alert-${type}`;
            };

            if (passwordValue.length < 8) {
                showMessage('La contraseña debe tener al menos 8 caracteres.', 'danger');
                return;
            }

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: passwordValue
            };

            // Enviamos los datos a Laravel usando fetch
            fetch('/api/registro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json' // Le decimos a Laravel que somos una API
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                const messageEl = document.getElementById('message');
                const showMessage = (text, type) => {
                    messageEl.textContent = text;
                    messageEl.className = `auth-message mb-3 alert alert-${type}`;
                };

                if (data.mensaje) {
                    showMessage(data.mensaje, 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1400);
                } else {
                    showMessage('Hubo un error en el registro. Verifica tus datos.', 'danger');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const messageEl = document.getElementById('message');
                messageEl.textContent = 'No se pudo conectar con el servidor. Intenta más tarde.';
                messageEl.className = 'auth-message mb-3 alert alert-danger';
            });
        });
    </script>
</body>
</html>
