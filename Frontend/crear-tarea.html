<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Tarea - UPVE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; }
        .auth-card { border-radius: 15px; }
        .rounded-description { border-radius: 10px; resize: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <span class="navbar-brand fw-bold" id="userDisplayName">Cargando...</span>
            <button onclick="logout()" class="btn btn-outline-secondary btn-sm">cerrar sesión</button>
        </div>
    </nav>

    <div class="container d-flex justify-content-center">
        <div class="card p-4 border-0 shadow-sm" style="width: 450px; border-radius: 15px;">
            <h4 class="text-center mb-4">Nueva Tarea</h4>
            
            <form id="formTarea" class="text-center">
                <div class="mb-4">
                    <input type="text" id="nombre" class="form-control" placeholder="Nombre de la tarea" style="border-radius: 10px;" required>
                </div>
                
                <div class="mb-4">
                    <textarea id="descripcion" class="form-control rounded-description" rows="6" placeholder="Descripción" style="border-radius: 10px;"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-dark py-2" style="border-radius: 10px;">Crear</button>
                    <a href="usuario.html" class="btn btn-link btn-sm text-muted text-decoration-none">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

   <script>
    // 1. Al cargar: Ya no expulsa al usuario
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }
        const nombre = localStorage.getItem('usuarioNombre');
        // Si no hay nombre, ponemos "Invitado"
        document.getElementById('userDisplayName').innerText = nombre ? nombre : "Invitado";
    });

    // 2. Evento para guardar la tarea
    document.getElementById('formTarea').addEventListener('submit', function(e) {
        e.preventDefault();

        const data = {
            nombre: document.getElementById('nombre').value,
            descripcion: document.getElementById('descripcion').value
        };

        fetch('/api/tareas', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            },
            body: JSON.stringify(data) // Enviamos solo los datos de la tarea
        })
        .then(response => {
            if (!response.ok) throw response;
            return response.json();
        })
        .then(result => {
            Swal.fire({
                icon: 'success',
                title: '¡Éxito!',
                text: result.mensaje || '¡Tarea creada con éxito!',
                timer: 2000,
                showConfirmButton: false,
                didClose: () => {
                    window.location.href = 'usuario.html';
                }
            });
        })
        .catch(error => {
            console.error('Error:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudo guardar la tarea. Verifica que Laravel esté corriendo.',
                confirmButtonText: 'Intentar de nuevo'
            });
        });
    });
</script>
</body>
</html>
